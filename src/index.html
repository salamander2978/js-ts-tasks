<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Profile</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>
<body>
    <div class="iphone-frame">
        <div class="instagram-profile">
            <header class="profile-header">
                <div class="username">salamander</div>
            </header>
            <div class="profile-info">
                <div class="profile-photo">
                    <img src="photo_2025-01-25_17-35-08.jpg" alt="Profile Photo">
                </div>
                <div class="stats">
                    <div><strong>228</strong> Posts</div>
                    <div><strong>666</strong> Followers</div>
                    <div><strong>420</strong> Following</div>
                </div>
            </div>
            <div class="bio">
                <div class="name">SalamanderK</div>
                <div class="website">
                    <a href="https://youtu.be/dQw4w9WgXcQ" target="_blank" rel="noopener noreferrer">
                        https://youtu.be/dQw4w9WgXcQ
                    </a>
                </div>
            </div>
            <div class="buttons">
                <button>Follow</button>
                <button>Message</button>
            </div>
            <div class="stories">
                <div class="story"><img src="photo_2024-09-12_00-15-22.jpg" alt="Story 1"></div>
                <div class="story"><img src="photo_2024-08-06_17-44-22.jpg" alt="Story 2"></div>
                <div class="story"><img src="post3.jpg" alt="Story 3"></div>
            </div>
            <div class="gallery">
                <img src="post1.jpg" alt="Post 1">
                <img src="post2.jpg" alt="Post 2">
                <img src="post3.jpg" alt="Post 3">
                <img src="post4.jpg" alt="Post 4">
                <img src="post5.jpg" alt="Post 5">
                <img src="post6.jpg" alt="Post 6">
            </div>
        </div>
        <footer class="nav-icons">
            <i class="fas fa-home"></i>
            <i class="fas fa-search"></i>
            <i class="fas fa-plus-square"></i>
            <i class="fas fa-heart"></i>
            <i class="fas fa-user"></i>
        </footer>
    </div>
</body>
</html>

<style>
body {
    background-color: rgb(5, 0, 34);
    font-family: Arial, sans-serif;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
}

.iphone-frame {
    width: 375px;
    height: 812px;
    background-color: #000;
    border-radius: 40px;
    overflow: hidden;
    border: 10px solid black;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
}

.instagram-profile {
    padding: 20px;
    text-align: center;
    flex: 1;
    overflow-y: auto;
}

.profile-header {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 10px;
}

.profile-info {
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.profile-photo img {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    border: 2px solid gray;
}

.stats {
    display: flex;
    flex-direction: column;
    text-align: center;
    font-size: 14px;
}

.bio {
    margin-top: 10px;
    font-size: 14px;
    color: gray;
}

.bio a {
    color: #0095f6;
    text-decoration: none;
}

.bio a:hover {
    text-decoration: underline;
}

.buttons {
    display: flex;
    gap: 5px;
    margin-top: 10px;
}

button {
    background: #262626;
    color: white;
    border: none;
    padding: 5px 10px;
    border-radius: 5px;
    cursor: pointer;
    font-size: 14px;
}

button:first-child {
    background: #0095f6;
}

.stories {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-top: 10px;
}

.story img {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    border: 2px solid gray;
}

.gallery {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 2px;
    margin-top: 10px;
}

.gallery img {
    width: 100%;
    height: 100px;
    object-fit: cover;
}

.nav-icons {
    display: flex;
    justify-content: space-around;
    font-size: 22px;
    padding: 10px 0;
    background-color: #000;
    border-top: 1px solid gray;
}
</style>
